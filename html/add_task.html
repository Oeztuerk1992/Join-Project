<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Task</title>
    <link rel="stylesheet" href="../styles/add_task.css" />
    <link rel="stylesheet" href="../styles/sidebar.css" />
  </head>
  <body>
    <div class="app">

        <!-- Sidebar wird später geladen -->
        <aside id="sidebar"></aside>

        <main class="content">

            <div class="header">

                <div></div>

                <div class="user-profile">
                    NAME
                </div>

            </div>

            <section class="add-task-container">

                <h1>Add Task</h1>

                <form id="addTaskForm">

                    <div class="form-wrapper">

                        <!-- LINKER BEREICH -->

                        <div class="left-side">

                            <div class="input-group">

                                <label>Title<span>*</span></label>

                                <input
                                    type="text"
                                    placeholder="Enter a title">

                            </div>

                        <div class="input-group">

    <label>Description</label>

    <div class="textarea-wrapper">

        <textarea
            placeholder="Enter a Description"></textarea>

        <img
            class="textarea-icon"
            src="../assets/icons/description/Capa 1.svg"
            alt="">

    </div>

</div>

                            <div class="input-group">

                                <label>Due date<span>*</span></label>

                                <input type="date">

                            </div>

                        </div>

                        <div class="separator"></div>

                        <!-- RECHTER BEREICH -->

                        <div class="right-side">

                            <div class="input-group">

                                <label>Priority</label>

                                <div class="priority-container">

                                    <button type="button" class="priority urgent">
                                        Urgent
                                        <img src="../assets/icons/priority/Property 1=Urgent.svg">
                                    </button>

                                    <button type="button" class="priority medium ">
                                        Medium
                                        <img src="../assets/icons/priority/Property 1=Medium.svg">
                                    </button>

                                    <button type="button" class="priority low">
                                        Low
                                        <img src="../assets/icons/priority/Property 1=Low.svg">
                                    </button>

                                </div>

                            </div>

                            <div class="input-group">

                                <label>Assigned to</label>

    <div class="dropdown-container">

        <div class="dropdown" onclick="toggleDropdown()">

            <span>Select contacts to assign</span>

            <img
                id="dropdownArrow"
                src="../assets/icons/dropdown/Property 1=Default.svg"
                alt="">

        </div>

        <div id="dropdownMenu" class="dropdown-menu">

            <div class="dropdown-item">

                <div class="contact-info">

                    <div class="contact-circle blue">
                        TK
                    </div>

                    <span>Testkontakt 1</span>

                </div>

                <input type="checkbox">

            </div>

            <div class="dropdown-item">

                <div class="contact-info">

                    <div class="contact-circle orange">
                        TM
                    </div>

                    <span>Testkontakt 2</span>

                </div>

                <input type="checkbox">

            </div>

            <div class="dropdown-item">

                <div class="contact-info">

                    <div class="contact-circle purple">
                        TS
                    </div>

                    <span>Testkontakt 3</span>

                </div>

                <input type="checkbox">

            </div>

        </div>

    </div>

</div>

                            <div class="input-group">

                                <label>Category<span>*</span></label>

                                <div class="dropdown">

                                    <span>Select task category</span>

                                    <img src="../assets/icons/dropdown/Property 1=Default.svg">

                                </div>

                            </div>

                            <div class="input-group">

                                <label>Subtasks</label>

                  <div class="subtask-input active">

    <input
        type="text"
        placeholder="Add new subtask">

    <div class="subtask-actions">

        <button>
            <img src="../assets/icons/edit_delete/Property 1=close.svg">
        </button>

        <div class="subtask-divider"></div>

        <button>
            <img src="../assets/icons/edit_delete/Property 1=check.svg">
        </button>

    </div>

</div>
                </div>
              </div>
            </div>

                    <div class="bottom-area">

                        <p><span>*</span>This field is required</p>

                        <div class="button-area">

                            <button
                                type="reset"
                                class="clear-btn">

                                Clear

                            </button>

                            <button
                                type="submit"
                                class="create-btn">

                                Create Task

                            </button>

                        </div>

                    </div>

                </form>

            </section>

        </main>

    </div>
    <script>
      function toggleDropdown() {

    document
        .getElementById("dropdownMenu")
        .classList.toggle("show");

    document
        .getElementById("dropdownArrow")
        .classList.toggle("rotate");
}
    </script>
  </body>
</html>
