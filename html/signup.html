<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="../assets/img/favicon/favicon_light.svg" media="(prefers-color-scheme: dark)"
    type="image/svg+xml" />
  <link rel="icon" href="../assets/img/favicon/favicon_dark.svg" media="(prefers-color-scheme: light)"
    type="image/svg+xml" />
  <title>Sign-up</title>
  <link rel="stylesheet" href="../styles.css" />
  <link rel="stylesheet" href="../styles/colors.css" />
  <link rel="stylesheet" href="../styles/font.css" />
  <link rel="stylesheet" href="../styles/login_layout.css" />
  <link rel="stylesheet" href="../styles/login_footer.css" />
  <link rel="stylesheet" href="../styles/login_components.css" />
</head>

<body class="signup-page" onload="initSignup()">
  <header class="header-index-page">
    <div class="frame-header">
      <img class="logo-container" src="../assets/img/login/join_logo_big.svg" alt="Join Logo" />
    </div>
  </header>
  <div class="container">
    <main class="login-wrapper">
      <div class="signup-card container-position" id="signup-window">
        <button class="back-btn" id="btn-close-signup" onclick="getToLogin()"></button>
        <h1>Sign up</h1>
        <div class="underline-signup"></div>
        <form id="form-for-signup" class="signup-form" onsubmit="return checkFormDataSignup(event)" novalidate>
          <div id="input-signup-name" class="input-group input-signup">
            <input type="text" id="signup-name" placeholder="Name" />
            <img class="icon" src="../assets/img/login/person.svg" alt="img-person" />
          </div>
          <div id="input-signup-mail" class="input-group input-signup">
            <input type="email" id="signup-mail" placeholder="Email" />
            <img class="icon" src="../assets/img/login/mail.svg" alt="img-mail" />
          </div>
          <div id="input-signup-pw" class="input-group input-signup">
            <input type="password" id="signup-pw" placeholder="Password" />
            <button type="button" id="btn-pw-two" class="icon toggle-pw">
            </button>
          </div>
          <div id="input-signup-confirm-pw" class="input-group input-signup">
            <input type="password" id="check-pw" placeholder="Confirm Password" />
            <button type="button" id="btn-pw-three" class="icon toggle-pw">
            </button>
          </div>
          <div id="validation-feedback" class="info-failed signup-validation-width hidden-feedback"></div>
          <div class="privacy-row">
            <input type="checkbox" id="privacy-policy" class="checkbox-privacy" />
            <label for="privacy-policy" class="privacy-label">
              <span class="checkbox-icon"></span>
              <div class="subcontainer-checkbox-privacy">
                <span class="text-accept-privacy">I accept the</span>
                <a class="link-privacy" href="privacy_policy.html" target="_blank">Privacy policy</a>
              </div>
            </label>
          </div>
          <button type="submit" class="signup-btn btn-signup-big">Sign up</button>
        </form>
      </div>
      <dialog id="confirmation-dialog" class="confirm">
        You Signed Up successfully
      </dialog>
    </main>
    <footer class="footer-login">
      <a href="privacy_policy.html">Privacy Policy</a>
      <a href="legal_notice.html">Legal notice</a>
    </footer>
    <script src="../scripts/startpage/startpage_main.js"></script>
    <script src="../scripts/startpage/startpage_login_api.js"></script>
    <script src="../scripts/startpage/startpage_signup.js"></script>
    <script src="../script.js"></script>
    <script src="../scripts/contact/contact.js"></script>
    <script src="../scripts/contact/contact_update.js"></script>
    <script src="../scripts/contact/contact_api_part1.js"></script>
    <script src="../scripts/contact/contact_api_part2.js"></script>
    <script src="../scripts/contact/contact_validation.js"></script>
    <script src="../scripts/templates/contact_template.js"></script>
  </div>
</body>

</html>
