<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="./assets/img/favicon/favicon_light.svg" media="(prefers-color-scheme: dark)"
    type="image/svg+xml" />
  <link rel="icon" href="./assets/img/favicon/favicon_dark.svg" media="(prefers-color-scheme: light)"
    type="image/svg+xml" />
  <title>Login</title>
  <link rel="stylesheet" href="./styles.css" />
  <link rel="stylesheet" href="./styles/colors.css" />
  <link rel="stylesheet" href="./styles/font.css" />
  <link rel="stylesheet" href="./styles/login_layout.css" />
  <link rel="stylesheet" href="./styles/login_components.css" />
</head>

<body class="login-page" onload="initLogin()">
    <div class="landscape-warning">
    <p>Please rotate your device to portrait mode.</p>
    </div>
  <div id="splash" class="logo-splash"></div>
  <header class="header-index-page">
    <div class="frame-header">
      <div class="logo-container"></div>
      <div class="signup-section" id="open-signup">
      <span class="question-signup-info">Not a Join user?</span>
      <button class="signup-btn" onclick="goToSignup()">Sign up</button>
      </div>
    </div>
  </header>
  <img id="animated-logo" class="logo" src="./assets/img/login/join_logo_big.svg" alt="Join Logo" />
  <div class="container hidden-splash">

    <main class="login-wrapper">
      <dialog class="login-card modal-class" id="login-modal">
        <form id="form-for-login" class="login-form" onsubmit="return checkFormDataLogin(event)" novalidate>
          <h1>Log in</h1>
          <div class="underline-login"></div>
          <div id="login-mail-group" class="input-group">
            <input type="email" id="login-mail" placeholder="Email" autocomplete="username" />
            <img class="icon" src="./assets/img/login/mail.svg" alt="img-mail" />
          </div>
          <div id="login-password-group" class="input-group">
            <input type="password" id="login-password" placeholder="Password" autocomplete="current-password" />
            <button type="button" id="btn-pw-one" class="icon toggle-pw">
            </button>
          </div>
          <p id="feedback-login" class="info-failed fail-login hidden-feedback">
            Check your email and password. Please try again.
          </p>
          <div class="button-row">
            <button type="submit" class="login-btn">Log in</button>
            <button type="button" class="guest-btn" onclick="logInGuest('guest')">Guest Log in</button>
          </div>
        </form>
      </dialog>
      
    </main>
    <footer class="footer-login">
      <a href="./html/privacy_policy.html">Privacy Policy</a>
      <a href="./html/legal_notice.html">Legal notice</a>
    </footer>
    <script src="./scripts/startpage_main.js"></script>
    <script src="./scripts/startpage_login_api.js"></script>
    <script src="./scripts/contact.js"></script>
    <script src="./scripts/contact_update.js"></script>
    <script src="./scripts/contact_api.js"></script>
    <script src="./scripts/contact_validation.js"></script>
    <script src="./scripts/templates/contact_template.js"></script>
  </div>
</body>

</html>
